# Threshold Hospitality Group

title: Threshold Hospitality Group
description: >-
  Threshold Hospitality Group partners with a select group of hotel owners and
  investors through hospitality management, owner advisory, acquisitions, and
  long-term asset stewardship.

url: "https://thresholdhospitalitygroup.com"
email: "contactus@thresholdhospitalitygroup.com"
baseurl: ""

# Build settings
markdown: kramdown
kramdown:
  auto_ids: false

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude from the generated site
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - netlify.toml
  - package.json
  - package-lock.json
  - node_modules
  - vendor
